name: build

# Пуш в main (в том числе merge PR) собирает образ и публикует его в GHCR.
# Деплой на узел этим не занимается: мини-ПК сам забирает новый образ по
# таймеру — GitHub до него не достучится, узел за NAT.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/paintingpromisesss/deadliner_bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Узел — linux/amd64; сборка под одну платформу экономит время.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш слоёв между запусками: без него npm ci и go build каждый раз
          # с нуля.
          cache-from: type=gha
          cache-to: type=gha,mode=max