services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deadliner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deadliner}
      POSTGRES_DB: ${POSTGRES_DB:-deadliner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deadliner} -d ${POSTGRES_DB:-deadliner}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env

volumes:
  pgdata:
